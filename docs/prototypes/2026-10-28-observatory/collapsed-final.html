<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Agent Metrics — Collapsed Tokens</title>
  <style>
    :root {
      --canvas: #eeede7;
      --ink: #20251f;
      --phosphor: #a5f8ea;
      --label: #d0d9cf;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--canvas);
    }

    .board {
      position: relative;
      width: 520px;
      height: 260px;
      flex-shrink: 0;
      background: var(--canvas);
      overflow: visible;
    }

    .specimen {
      position: absolute;
      width: 88px;
      height: 88px;
    }

    .native { left: 48px; top: 86px; }

    /* Exact 3× scale is 264px high: it overhangs the 260px board by
       2px at each edge, preserving both specified sizes without clipping. */
    .enlarged {
      left: 312px;
      top: 86px;
      transform: scale(3);
      transform-origin: center;
    }

    .widget {
      position: relative;
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      border-radius: 21px;
      background: var(--ink);
      box-shadow: inset 0 0 0 1px #ffffff0b;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .reading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      transform: translateY(1px);
      text-align: center;
      white-space: nowrap;
    }

    .value {
      display: block;
      margin: 0;
      color: var(--phosphor);
      font-family: 'Cascadia Mono', Consolas, 'Liberation Mono', monospace;
      font-size: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 32px;
      letter-spacing: -1px;
      text-indent: -1px;
    }

    .label {
      display: block;
      color: var(--label);
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      font-size: 10px;
      font-weight: 600;
      line-height: 12px;
      letter-spacing: 1.6px;
      text-indent: 1.6px;
    }

    .ready {
      position: absolute;
      top: 11px;
      right: 12px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--phosphor);
      opacity: .7;
    }
  </style>
</head>
<body>
  <main class="board" aria-label="Collapsed token widget: native size and three-times magnification">
    <div class="specimen native">
      <div class="widget" role="img" aria-label="406 million tokens. Ready.">
        <span class="ready" aria-hidden="true"></span>
        <div class="reading" aria-hidden="true">
          <span class="value">406M</span>
          <span class="label">TOKENS</span>
        </div>
      </div>
    </div>
    <div class="specimen enlarged" aria-hidden="true">
      <div class="widget">
        <span class="ready"></span>
        <div class="reading">
          <span class="value">406M</span>
          <span class="label">TOKENS</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
